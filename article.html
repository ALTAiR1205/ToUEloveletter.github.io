<!DOCTYPE html>

<head>

<link href="https://fonts.googleapis.com" rel="preconnect"/>

<body class="sub-page article-sub-page article-dynamic-page">
<script>(function(){try{var t=localStorage.getItem('theme');if(t!=='light')document.body.classList.add('dark');if(t==='bloom')document.body.classList.add('bloom');if(t==='light')document.body.classList.add('daylight');if(t!=='light'&&t!=='bloom')document.body.classList.add('night');}catch(e){}})();</script>

<div aria-hidden="true" class="scroll-progress" id="scrollProgress"><span></span></div>
<canvas class="space-canvas" id="spaceCanvas" aria-hidden="true"></canvas>

<div aria-hidden="true" class="nebula-field">
<div class="nebula n-1"></div>
<div class="nebula n-2"></div>
<div class="nebula n-3"></div>
</div>

<div aria-hidden="true" class="planet-horizon" id="planetHorizon"></div>
<div aria-hidden="true" class="vignette"></div>

<div aria-hidden="true" class="bloom-scene" id="bloomScene">
<canvas id="bloomCanvas"></canvas>
<video id="bloomVideo" muted playsinline preload="none"></video>
<div class="bloom-scrim"></div>
</div>

<div aria-hidden="true" class="dayvid-scene" data-fixed="1" id="dayvidScene">
<div class="dayvid-scrim"></div>
</div>

<div aria-hidden="true" class="day-scene">
<div class="day-sun"></div>
<div class="day-haze haze-a"></div>
<div class="day-haze haze-b"></div>
<div class="sakura-petal-layer" id="sakuraPetalLayer"></div>
</div>

<div aria-hidden="true" class="cursor-dot" id="cursorDot"></div>
<div aria-hidden="true" class="cursor-ring" id="cursorRing"></div>

</article>

<audio id="bgm" preload="auto"></audio>
<div class="music-dock" id="musicDock" aria-label="音乐播放器">
<button aria-label="播放或暂停" class="disc" id="discBtn" type="button">
<svg aria-hidden="true" class="disc-ring" viewBox="0 0 48 48">
<circle class="ring-track" cx="24" cy="24" r="21"></circle>
<circle class="ring-fill" cx="24" cy="24" id="discProgress" r="21"></circle>
</svg>
<span class="disc-core"></span>
</button>
<div class="music-info">
<strong id="trackTitle">η</strong>

</div>
